name: wardrobe_ai_app
description: "Virtual Wardrobe & AI Stylist Mobile App (Riverpod, SQLite, AdMob, Cupertino/M3 Minimalist Design)"
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Design & Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Storage & Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Media & Image Handling
  image_picker: ^1.1.2
  image: ^4.2.0

  # Calendar Widget
  table_calendar: ^3.1.2

  # Monetization (AdMob)
  google_mobile_ads: ^9.1.0

  # Networking & Environment
  http: ^1.2.2
  flutter_dotenv: ^5.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  sqflite_common_ffi_web: ^1.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
